name: CI

on:
  # Branches are checked through their pull request, which covers forks too. Run any other branch by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The tests stand in for $EDITOR and $BROWSER with zsh scripts.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
      - run: bun run typecheck
      - run: bun test ./test

  # The release builds Windows too. This proves a branch still builds and starts there before a tag finds out.
  # The tests and the tmux e2e stay on Linux.
  windows:
    name: Windows ${{ matrix.arch }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Build
        run: WRIKE_TUI_VERSION=0.0.0-ci bun run build
      - name: Smoke run
        run: |
          said="$(./dist/wrike-tui.exe --version)"
          echo "$said"
          test "$said" = "wrike-tui 0.0.0-ci"

  e2e:
    name: End to end in tmux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install tmux, zsh and a secret service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux zsh dbus gnome-keyring
      # The auth tests store the token in the OS keyring, so the run needs a session bus with an unlocked keyring on it.
      - name: Run the e2e suite
        env:
          WRIKE_TUI_E2E_CAPTURES: ${{ runner.temp }}/captures
        run: dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && bun run e2e'
      - name: Keep the screens of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
