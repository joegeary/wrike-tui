name: CI

on:
  # Branches are checked through their pull request, which covers forks too. Run any other branch by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The tests stand in for $EDITOR and $BROWSER with zsh scripts.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
      - run: bun run typecheck
      - run: bun test ./test

  e2e:
    name: End to end in tmux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install tmux, zsh and a secret service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux zsh dbus gnome-keyring
      # The auth tests store the token in the OS keyring, so the run needs a session bus with an unlocked keyring on it.
      - name: Run the e2e suite
        env:
          WRIKE_TUI_E2E_CAPTURES: ${{ runner.temp }}/captures
        run: dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && bun run e2e'
      - name: Keep the screens of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
