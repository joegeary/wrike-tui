name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LANG: C.UTF-8

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    # OpenTUI ships a native library per platform, so each binary is built on its own platform, not cross-compiled.
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: linux, arch: x64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: darwin, arch: x64, runner: macos-15-intel }
          - { os: windows, arch: x64, runner: windows-latest, exe: .exe }
          - { os: windows, arch: arm64, runner: windows-11-arm, exe: .exe }
    runs-on: ${{ matrix.runner }}
    # Git Bash on the Windows runners, so every step reads the same.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          echo "WRIKE_TUI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          WRIKE_TUI_VERSION="${GITHUB_REF_NAME#v}" bun run build
      - name: Smoke run
        run: |
          said="$(./dist/wrike-tui${{ matrix.exe }} --version)"
          echo "$said"
          test "$said" = "wrike-tui ${WRIKE_TUI_VERSION}"
      # A tarball for Linux and macOS and a zip for Windows, each what that platform opens without reaching for anything.
      - name: Pack
        if: matrix.os != 'windows'
        run: tar -czf "wrike-tui-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist wrike-tui
      - name: Pack
        if: matrix.os == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/wrike-tui.exe -DestinationPath "wrike-tui-${{ matrix.os }}-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: wrike-tui-${{ matrix.os }}-${{ matrix.arch }}
          path: wrike-tui-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.os == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          sha256sum wrike-tui-*.tar.gz wrike-tui-*.zip > SHA256SUMS
          cat SHA256SUMS
      # A tag with a suffix (v0.3.0-rc.1) is a pre-release, which the releases/latest lookup in install.sh,
      # install.ps1 and wrike-tui update never returns.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}" assets/*
